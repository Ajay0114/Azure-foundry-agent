# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# Deploys the Marina bot as a Foundry hosted agent (Responses protocol), in the format `azd ai agent init` writes
# (extension azure.ai.agents beta.18). The Foundry project and the model deployment already exist: nothing here creates them.
#
# Every ${NAME} under env: is read from the azd environment (not your shell) when you deploy. `scripts/set-azd-env.sh` copies the
# values from src/marina-bot/.env into it; a name that is not set expands to an empty value, which the bot treats as "use the
# default" for the optional ones. See DEPLOYMENT.md.

requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
name: marina-bot
services:
    ai-project:
        host: azure.ai.project
        endpoint: https://marina-poc.services.ai.azure.com/api/projects/proj-default
    marina-bot:
        project: ./src/marina-bot
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        # Foundry injects FOUNDRY_PROJECT_ENDPOINT and APPLICATIONINSIGHTS_CONNECTION_STRING itself.
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # Conversation state and transcripts (Azure Blob Storage). The connection string is an optional stopgap.
            STATE_BLOB_ACCOUNT_URL: ${STATE_BLOB_ACCOUNT_URL}
            STATE_BLOB_CONTAINER: ${STATE_BLOB_CONTAINER}
            STATE_BLOB_CONNECTION_STRING: ${STATE_BLOB_CONNECTION_STRING}
            DEBUG_TRACE: ${DEBUG_TRACE}
            TRANSCRIPT_ENABLED: ${TRANSCRIPT_ENABLED}
            TRANSCRIPT_MASK_PII: ${TRANSCRIPT_MASK_PII}
            TRANSCRIPT_BOT_NAME: ${TRANSCRIPT_BOT_NAME}
            TRANSCRIPT_CHANNEL: ${TRANSCRIPT_CHANNEL}
            # OneSpaWorld vessel and itinerary APIs
            OSW_BASE_URL: ${OSW_BASE_URL}
            OSW_TOKEN_URL: ${OSW_TOKEN_URL}
            OSW_CLIENT_ID: ${OSW_CLIENT_ID}
            OSW_CLIENT_SECRET: ${OSW_CLIENT_SECRET}
            OSW_VESSELS_SCOPE: ${OSW_VESSELS_SCOPE}
            OSW_ITINERARY_SCOPE: ${OSW_ITINERARY_SCOPE}
            # Zendesk
            ZENDESK_BASE_URL: ${ZENDESK_BASE_URL}
            ZENDESK_AUTHORIZATION: ${ZENDESK_AUTHORIZATION}
            ZENDESK_FORM_ID: ${ZENDESK_FORM_ID}
            ZENDESK_BRAND_ID: ${ZENDESK_BRAND_ID}
            ZENDESK_RETURN_GROUP_ID: ${ZENDESK_RETURN_GROUP_ID}
            ZENDESK_FIELD_CREATED_BY: ${ZENDESK_FIELD_CREATED_BY}
            ZENDESK_FIELD_PRIORITY: ${ZENDESK_FIELD_PRIORITY}
            ZENDESK_FIELD_INQUIRY_TYPE: ${ZENDESK_FIELD_INQUIRY_TYPE}
            ZENDESK_FIELD_CATEGORY: ${ZENDESK_FIELD_CATEGORY}
            ZENDESK_FIELD_CRUISE_LINE: ${ZENDESK_FIELD_CRUISE_LINE}
            ZENDESK_FIELD_CRUISE_SHIP: ${ZENDESK_FIELD_CRUISE_SHIP}
            ZENDESK_FIELD_SAIL_DATE: ${ZENDESK_FIELD_SAIL_DATE}
            ZENDESK_FIELD_PRODUCT_REASON: ${ZENDESK_FIELD_PRODUCT_REASON}
            ZENDESK_FIELD_RETURN_STATUS: ${ZENDESK_FIELD_RETURN_STATUS}
            ZENDESK_TAGS: ${ZENDESK_TAGS}
            # Attachment scan-and-stage function
            ATTACHMENT_API_URL: ${ATTACHMENT_API_URL}
            ATTACHMENT_API_KEY: ${ATTACHMENT_API_KEY}
            # Document-creation API
            DOCUMENT_API_URL: ${DOCUMENT_API_URL}
            DOCUMENT_CLIENT_ID: ${DOCUMENT_CLIENT_ID}
            DOCUMENT_CLIENT_SECRET: ${DOCUMENT_CLIENT_SECRET}
            DOCUMENT_RETURNS_SCOPE: ${DOCUMENT_RETURNS_SCOPE}
            DOCUMENT_TRANSACTIONS_SCOPE: ${DOCUMENT_TRANSACTIONS_SCOPE}
            DOCUMENT_TOKEN_URL: ${DOCUMENT_TOKEN_URL}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: marina-bot
        displayName: Marina product returns
        description: "Marina, the OneSpaWorld customer-service bot. Product returns, from the first message to a Zendesk ticket and the return documents."
        protocols:
            - protocol: responses
              version: 2.0.0
    # The document-event callback: a second hosted agent from the same code, started from callback_main.py. OneSpaWorld's
    # document service sends it events; it updates the Zendesk ticket. No model is used. See DEPLOYMENT.md.
    marina-callback:
        project: ./src/marina-bot
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            STATE_BLOB_ACCOUNT_URL: ${STATE_BLOB_ACCOUNT_URL}
            STATE_BLOB_CONTAINER: ${STATE_BLOB_CONTAINER}
            STATE_BLOB_CONNECTION_STRING: ${STATE_BLOB_CONNECTION_STRING}
            OSW_BASE_URL: ${OSW_BASE_URL}
            OSW_TOKEN_URL: ${OSW_TOKEN_URL}
            OSW_CLIENT_ID: ${OSW_CLIENT_ID}
            OSW_CLIENT_SECRET: ${OSW_CLIENT_SECRET}
            OSW_VESSELS_SCOPE: ${OSW_VESSELS_SCOPE}
            OSW_ITINERARY_SCOPE: ${OSW_ITINERARY_SCOPE}
            ZENDESK_BASE_URL: ${ZENDESK_BASE_URL}
            ZENDESK_AUTHORIZATION: ${ZENDESK_AUTHORIZATION}
            ZENDESK_FORM_ID: ${ZENDESK_FORM_ID}
            ZENDESK_BRAND_ID: ${ZENDESK_BRAND_ID}
            ZENDESK_RETURN_GROUP_ID: ${ZENDESK_RETURN_GROUP_ID}
            ZENDESK_FIELD_CREATED_BY: ${ZENDESK_FIELD_CREATED_BY}
            ZENDESK_FIELD_PRIORITY: ${ZENDESK_FIELD_PRIORITY}
            ZENDESK_FIELD_INQUIRY_TYPE: ${ZENDESK_FIELD_INQUIRY_TYPE}
            ZENDESK_FIELD_CATEGORY: ${ZENDESK_FIELD_CATEGORY}
            ZENDESK_FIELD_CRUISE_LINE: ${ZENDESK_FIELD_CRUISE_LINE}
            ZENDESK_FIELD_CRUISE_SHIP: ${ZENDESK_FIELD_CRUISE_SHIP}
            ZENDESK_FIELD_SAIL_DATE: ${ZENDESK_FIELD_SAIL_DATE}
            ZENDESK_FIELD_PRODUCT_REASON: ${ZENDESK_FIELD_PRODUCT_REASON}
            ZENDESK_FIELD_RETURN_STATUS: ${ZENDESK_FIELD_RETURN_STATUS}
            ZENDESK_FIELD_SPA_MANAGER_EMAIL: ${ZENDESK_FIELD_SPA_MANAGER_EMAIL}
            CALLBACK_SPA_MANAGER_EMAIL_OVERRIDE: ${CALLBACK_SPA_MANAGER_EMAIL_OVERRIDE}
            CALLBACK_UPLOAD_API_URL: ${CALLBACK_UPLOAD_API_URL}
            CALLBACK_UPLOAD_API_KEY: ${CALLBACK_UPLOAD_API_KEY}
            REDRIVE_API_URL: ${REDRIVE_API_URL}
            REDRIVE_API_KEY: ${REDRIVE_API_KEY}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: callback_main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: marina-callback
        displayName: Marina document callback
        description: "Receives document events from the OneSpaWorld document service and updates the matching Zendesk ticket: attaches the document, tags the ticket, adds an internal comment."
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
